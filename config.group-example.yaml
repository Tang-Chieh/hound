openai:
  api_key_env: HOUND_GATEWAY_TOKEN
  base_url: http://127.0.0.1:14000/v1
models:
  graph: &subscription
    provider: openai
    model: openai-codex/gpt-5.6-luna
    max_context: 64000
  scout: *subscription
  agent: *subscription
  strategist: *subscription
  guidance: *subscription
  lightweight: *subscription
  finalize: *subscription
  qa: *subscription
  reporting: *subscription
context:
  max_tokens: 64000
  compression_threshold: 0.75
timeouts:
  request_seconds: 60
retries:
  max_attempts: 3
  backoff_min_seconds: 10
  backoff_max_seconds: 30
