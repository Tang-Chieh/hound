tended"], "content": "// SPDX-License-Identifier: UNLICENSED\npragma solidity 0.8.3;\nimport \"./interfaces/iBEP20.sol\";\nimport \"./interfaces/iDAO.sol\";\nimport \"./interfaces/iBASE.sol\";\nimport \"./interfaces/iPOOL.sol\";\nimport \"./interfaces/iSYNTH.sol\";\nimport \"./interfaces/iUTILS.sol\";\nimport \"./interfaces/iRESERVE.sol\";\nimport \"./interfaces/iSYNTHFACTORY.sol\";\nimport \"./interfaces/iPOOLFACTORY.sol\";\n\ncontract SynthVault {\n    address public BASE;\n    address public DEPLOYER;\n\n    uint256 public minimumDepositTime;  // Withdrawal & Harvest lockout period; intended to be 1 hour\n    uint256 public totalWeight;         // Total weight of the whole SynthVault\n    uint256 public erasToEarn;          // Amount of eras that make up the targeted RESERVE depletion; regulates incentives\n    uint256 public vaultClaim;          // The SynthVaults's portion of rewards; intended to be ~10% initially\n    address [] public stakedSynthAssets; // Array of all synth assets that have ever been staked in (scope: vault)\n    uint private lastMonth;             // Timestamp of the start of current metric period (For UI)\n    uint public genesis;                // Timestamp from when the synth was first deployed (For UI)\n\n"}, "card_14fd5b91a947": {"id": "card_14fd5b91a947", "relpath": "contracts/interfaces/iBEP20.sol", "char_start": 0, "char_end": 859, "peek_head": "// SPDX-License-Identifier: UNLICENSED\npragma solidity 0.8.3;\ninterface iBEP20 {\n    function name()", "peek_tail": "nt256 value);\n    event Approval(address indexed owner, address indexed spender, uint256 value);\n}\n\n", "shingle_hash": "79b681c3aa4ef21b", "top_tokens": ["address", "function", "external", "returns", "uint256", "view", "indexed", "bool", "string", "memory"], "content": "// SPDX-License-Identifier: UNLICENSED\npragma solidity 0.8.3;\ninterface iBEP20 {\n    function name() external view returns (string memory);\n    function symbol() external view returns (string memory);\n    function decimals() external view returns (uint8);\n    function totalSupply() external view returns (uint256);\n    function balanceOf(address) external view returns (uint256);\n    function transfer(address, uint256) external returns (bool);\n    function allowance(address, address) external view returns (uint256);\n    function approve(address, uint256) external returns (bool);\n    function transferFrom(address, address, uint256) external returns (bool);\n    function burn(uint) external;\n    event Transfer(address indexed from, address indexed to, uint256 value);\n    event Approval(address indexed owner, address indexed spender, uint256 value);\n}\n"}, "card_93102a5f7e32": {"id": "card_93102a5f7e32", "relpath": "contracts/Dao.sol", "char_start": 15999, "char_end": 17176, "peek_head": "    // New DAO proposal: Address parameter\n    function newAddressProposal(address proposedAddress, ", "peek_tail": "     emit NewProposal(msg.sender, currentProposal, typeStr);\n        return currentProposal;\n    }\n\n", "shingle_hash": "a9f390fa9715f1e8", "top_tokens": ["currentproposal", "proposal", "new", "address", "typestr", "mappid", "set", "the", "type", "grant"], "content": "    // New DAO proposal: Address parameter\n    function newAddressProposal(address proposedAddress, string memory typeStr) external returns(uint) {\n        checkProposal(); // If no open proposal; construct new one\n        payFee(); // Pay SPARTA fee for new proposal\n        mapPID_address[currentProposal] = proposedAddress; // Set the proposed new address\n        mapPID_type[currentProposal] = typeStr; // Set the proposal type\n        emit NewProposal(msg.sender, currentProposal, typeStr);\n        return currentProposal;\n    }\n\n    // New DAO proposal: Grant SPARTA to wallet\n    function newGrantProposal(address recipient, uint amount) external returns(uint) {\n        checkProposal(); // If no open proposal; construct new one\n        payFee(); // Pay SPARTA fee for new proposal\n        string memory typeStr = \"GRANT\";\n        mapPID_type[currentProposal] = typeStr; // Set the proposal type\n        mapPID_address[currentProposal] = recipient; // Set the proposed grant recipient\n        mapPID_param[currentProposal] = amount; // Set the proposed grant amount\n        emit NewProposal(msg.sender, currentProposal, typeStr);\n        return currentProposal;\n    }\n\n"}, "card_8590e9b89619": {"id": "card_8590e9b89619", "relpath": "contracts/synthVault.sol", "char_start": 10460, "char_end": 11533, "peek_head": "    //================================ Helper Functions ===============================//\n\n    funct", "peek_tail": "mber) external view returns (uint256) {\n        return mapMemberSynth_weight[member][synth];\n    }\n\n", "shingle_hash": "2e8eafa1059c60cc", "top_tokens": ["member", "address", "function", "view", "returns", "uint256", "return", "synth", "external", "mapmembersynth"], "content": "    //================================ Helper Functions ===============================//\n\n    function reserveBASE() public view returns (uint256) {\n        return iBEP20(BASE).balanceOf(_DAO().RESERVE());\n    }\n\n    function getMemberDeposit(address synth, address member) external view returns (uint256){\n        return mapMemberSynth_deposit[member][synth];\n    }\n\n    function getMemberWeight(address member) external view returns (uint256) {\n        return mapMemberTotal_weight[member];\n    }\n\n    function getStakeSynthLength() external view returns (uint256) {\n        return stakedSynthAssets.length;\n    }\n\n    function getMemberLastTime(address member) external view returns (uint256) {\n        return mapMember_depositTime[member];\n    }\n\n    function getMemberLastSynthTime(address synth, address member) external view returns (uint256){\n        return mapMemberSynth_lastTime[member][synth];\n    }\n\n    function getMemberSynthWeight(address synth, address member) external view returns (uint256) {\n        return mapMemberSynth_weight[member][synth];\n    }\n\n"}, "card_a1cc7928400a": {"id": "card_a1cc7928400a", "relpath": "contracts/Router.sol", "char_start": 0, "char_end": 1095, "peek_head": "// SPDX-License-Identifier: UNLICENSED\npragma solidity 0.8.3;\nimport \"./Pool.sol\";\nimport \"./interfa", "peek_tail": "nlyDAO() {\n        require(msg.sender == _DAO().DAO() || msg.sender == DEPLOYER);\n        _;\n    }\n\n", "shingle_hash": "95d20068d72fe67f", "top_tokens": ["uint", "public", "the", "address", "private", "import", "sol", "interfaces", "dividend", "normalaveragefee"], "content": "// SPDX-License-Identifier: UNLICENSED\npragma solidity 0.8.3;\nimport \"./Pool.sol\";\nimport \"./interfaces/iRESERVE.sol\"; \nimport \"./interfaces/iPOOLFACTORY.sol\";  \nimport \"./interfaces/iWBNB.sol\";\n\ncontract Router {\n    address public BASE;\n    address public WBNB;\n    address public DEPLOYER;\n\n    uint private maxTrades;         // Amount of dividend events per era\n    uint private eraLength;         // Dividend factor to regulate the max percentage of RESERVE balance\n    uint public normalAverageFee;   // The average fee size (dividend smoothing)\n    uint private arrayFeeSize;      // The size of the average window used for normalAverageFee\n    uint [] private feeArray;       // The array used to calc normalAverageFee\n    uint private lastMonth;         // Timestamp of the start of current metric period (For UI)\n\n    mapping(address=> uint) public mapAddress_30DayDividends;\n    mapping(address=> uint) public mapAddress_Past30DayPoolDividends;\n\n    // Restrict access\n    modifier onlyDAO() {\n        require(msg.sender == _DAO().DAO() || msg.sender == DEPLOYER);\n        _;\n    }\n\n"}, "card_d22d04706375": {"id": "card_d22d04706375", "relpath": "contracts/interfaces/iPOOL.sol", "char_start": 0, "char_end": 590, "peek_head": "// SPDX-License-Identifier: UNLICENSED\npragma solidity 0.8.3;\ninterface iPOOL {\n    function TOKEN()", "peek_tail": "view returns(uint);\n    function mintSynth(address, address) external returns (uint256, uint256);\n}\n", "shingle_hash": "d515823989a6f96e", "top_tokens": ["function", "external", "returns", "uint", "view", "address", "uint256", "spdx", "license", "identifier"], "content": "// SPDX-License-Identifier: UNLICENSED\npragma solidity 0.8.3;\ninterface iPOOL {\n    function TOKEN() external view returns(address);\n    function removeLiquidity() external returns (uint, uint);\n    function genesis() external view returns(uint);\n    function baseAmount() external view returns(uint);\n    function tokenAmount() external view returns(uint);\n    function fees() external view returns(uint);\n    function volume() external view returns(uint);\n    function txCount() external view returns(uint);\n    function mintSynth(address, address) external returns (uint256, uint256);\n}"}, "card_40b150223058": {"id": "card_40b150223058", "relpath": "contracts/interfaces/iDAOVAULT.sol", "char_start": 0, "char_end": 319, "peek_head": "// SPDX-License-Identifier: UNLICENSED\npragma solidity 0.8.3;\ninterface iDAOVAULT{\nfunction getMembe", "peek_tail": "w(address, address) external returns (bool);\nfunction totalWeight() external view returns (uint);\n}\n", "shingle_hash": "16436174f3684461", "top_tokens": ["address", "function", "external", "returns", "view", "uint", "spdx", "license", "identifier", "unlicensed"], "content": "// SPDX-License-Identifier: UNLICENSED\npragma solidity 0.8.3;\ninterface iDAOVAULT{\nfunction getMemberWeight(address) external view returns (uint256);\nfunction depositLP(address, uint, address) external;\nfunction withdraw(address, address) external returns (bool);\nfunction totalWeight() external view returns (uint);\n}"}, "card_619d512d1af4": {"id": "card_619d512d1af4", "relpath": "contracts/Dao.sol", "char_start": 20477, "char_end": 22449, "peek_head": "    // Attempt to cancel the open proposal\n    function cancelProposal() external {\n        require(", "peek_tail": "else if (isEqual(_type, 'GET_SPARTA')){\n                _increaseSpartaAllocation(currentProposal);\n", "shingle_hash": "481b7bd0d615cb35", "top_tokens": ["currentproposal", "type", "else", "isequal", "proposal", "mappid", "the", "finalising", "open", "require"], "content": "    // Attempt to cancel the open proposal\n    function cancelProposal() external {\n        require(block.timestamp > (mapPID_startTime[currentProposal] + 1296000), \"!days\"); // Proposal must not be new\n        mapPID_votes[currentProposal] = 0; // Clear all votes from the proposal\n        mapPID_open[currentProposal] = false; // Set the proposal as not open (closed status)\n        emit CancelProposal(msg.sender, currentProposal);\n    }\n\n    // A finalising-stage proposal can be finalised after the cool off period\n    function finaliseProposal() external {\n        require((block.timestamp - mapPID_coolOffTime[currentProposal]) > coolOffPeriod, \"!cooloff\"); // Must be past cooloff period\n        require(mapPID_finalising[currentProposal] == true, \"!finalising\"); // Must be in finalising stage\n        if(!hasQuorum(currentProposal)){\n            mapPID_finalising[currentProposal] = false; // If proposal has lost quorum consensus; kick it out of the finalising stage\n        } else {\n            bytes memory _type = bytes(mapPID_type[currentProposal]); // Get the proposal type\n            if(isEqual(_type, 'DAO')){\n                moveDao(currentProposal);\n            } else if (isEqual(_type, 'ROUTER')) {\n                moveRouter(currentProposal);\n            } else if (isEqual(_type, 'UTILS')){\n                moveUtils(currentProposal);\n            } else if (isEqual(_type, 'RESERVE')){\n                moveReserve(currentProposal);\n            } else if (isEqual(_type, 'FLIP_EMISSIONS')){\n                flipEmissions(currentProposal);\n            } else if (isEqual(_type, 'COOL_OFF')){\n                changeCooloff(currentProposal);\n            } else if (isEqual(_type, 'ERAS_TO_EARN')){\n                changeEras(currentProposal);\n            } else if (isEqual(_type, 'GRANT')){\n                grantFunds(currentProposal);\n            } else if (isEqual(_type, 'GET_SPARTA')){\n                _increaseSpartaAllocation(currentProposal);\n"}, "card_d61c68a24f4f": {"id": "card_d61c68a24f4f", "relpath": "contracts/Dao.sol", "char_start": 6318, "char_end": 7429, "peek_head": "    // Contract deposits LP tokens for member\n    function depositLPForMember(address pool, uint256 ", "peek_tail": "mp; // Reset user's last harvest time\n        emit MemberDeposits(member, pool, amount);\n    }\n    \n", "shingle_hash": "0c9ef431902e5209", "top_tokens": ["member", "amount", "pool", "user", "daovault", "harvest", "address", "require", "true", "deposit"], "content": "    // Contract deposits LP tokens for member\n    function depositLPForMember(address pool, uint256 amount, address member) public {\n        require(_POOLFACTORY.isCuratedPool(pool) == true, \"!curated\"); // Pool must be Curated\n        require(amount > 0, \"!amount\"); // Deposit amount must be valid\n        if (isMember[member] != true) {\n            arrayMembers.push(member); // If not a member; add user to member array\n            isMember[member] = true; // If not a member; register the user as member\n        }\n        if((_DAOVAULT.getMemberWeight(member) + _BONDVAULT.getMemberWeight(member)) > 0) {\n            harvest(); // If member has existing weight; force harvest to block manipulation of lastTime + harvest\n        }\n        require(iBEP20(pool).transferFrom(msg.sender, address(_DAOVAULT), amount), \"!funds\"); // Send user's deposit to the DAOVault\n        _DAOVAULT.depositLP(pool, amount, member); // Update user's deposit balance & weight\n        mapMember_lastTime[member] = block.timestamp; // Reset user's last harvest time\n        emit MemberDeposits(member, pool, amount);\n    }\n    \n"}, "card_f521fdbca9f1": {"id": "card_f521fdbca9f1", "relpath": "contracts/poolFactory.sol", "char_start": 2708, "char_end": 4088, "peek_head": "    // Can create pools initially with no liquidity (not public)\n    function createPool(address tok", "peek_tail": "] = true; // Record pool as Curated\n        emit AddCuratePool(_pool, isCuratedPool[_pool]);\n    }\n\n", "shingle_hash": "f3ab9479120d508f", "top_tokens": ["pool", "token", "address", "the", "require", "must", "new", "newpool", "record", "add"], "content": "    // Can create pools initially with no liquidity (not public)\n    function createPool(address token) external onlyDAO returns(address pool){\n        require(getPool(token) == address(0)); // Must be a valid token\n        Pool newPool; address _token = token;\n        if(token == address(0)){_token = WBNB;} // Handle BNB -> WBNB\n        newPool = new Pool(BASE, _token); // Deploy new pool\n        pool = address(newPool); // Get address of new pool\n        mapToken_Pool[_token] = pool; // Record the new pool address in PoolFactory\n        arrayPools.push(pool); // Add pool address to the pool array\n        arrayTokens.push(_token); // Add token to the listed array\n        isListedPool[pool] = true; // Record pool as currently listed\n        emit CreatePool(token, pool);\n        return pool;\n    }\n\n    // Add pool to the Curated list, enabling it's synths & dividends & dao/vault weight\n    function addCuratedPool(address token) external onlyDAO {\n        require(token != BASE); // Token must not be SPARTA\n        address _pool = getPool(token); // Get pool address\n        require(isListedPool[_pool] == true); // Pool must be valid\n        require(curatedPoolCount() < curatedPoolSize, \"maxCurated\"); // Must be room in the Curated list\n        isCuratedPool[_pool] = true; // Record pool as Curated\n        emit AddCuratePool(_pool, isCuratedPool[_pool]);\n    }\n\n"}, "card_5b1ec474e741": {"id": "card_5b1ec474e741", "relpath": "contracts/Synth.sol", "char_start": 5857, "char_end": 7486, "peek_head": "    function _burn(address account, uint256 amount) internal virtual {\n        require(account != ad", "peek_tail": "   Pool(msg.sender).burn(_amountUnits); // Burn the LP tokens\n        }\n        return true;\n    }\n\n", "shingle_hash": "4d313d3a551f4753", "top_tokens": ["amount", "msg", "sender", "burn", "address", "account", "synths", "the", "mapsynth", "received"], "content": "    function _burn(address account, uint256 amount) internal virtual {\n        require(account != address(0), \"!account\");\n        require(_balances[account] >= amount, \"!balance\");\n        _balances[account] -= amount;\n        totalSupply -= amount;\n        emit Transfer(account, address(0), amount);\n    }\n\n    //==================================== SYNTH FUNCTIONS =================================//\n\n    // Handle received LP tokens and mint Synths\n    function mintSynth(address member, uint amount) external onlyPool returns (uint syntheticAmount){\n        uint lpUnits = _getAddedLPAmount(msg.sender); // Get the received LP units\n        mapSynth_LPDebt[msg.sender] += amount; // Increase debt by synth amount\n        mapSynth_LPBalance[msg.sender] += lpUnits; // Increase lp balance by LPs received\n        _mint(member, amount); // Mint the synths & tsf to user\n        return amount;\n    }\n    \n    // Handle received Synths and burn the LPs and Synths\n    function burnSynth() external returns (bool){\n        uint _syntheticAmount = balanceOf(address(this)); // Get the received synth units\n        uint _amountUnits = (_syntheticAmount * mapSynth_LPBalance[msg.sender]) / mapSynth_LPDebt[msg.sender]; // share = amount * part/total\n        mapSynth_LPBalance[msg.sender] -= _amountUnits; // Reduce lp balance\n        mapSynth_LPDebt[msg.sender] -= _syntheticAmount; // Reduce debt by synths being burnt\n        if(_amountUnits > 0){\n            _burn(address(this), _syntheticAmount); // Burn the synths\n            Pool(msg.sender).burn(_amountUnits); // Burn the LP tokens\n        }\n        return true;\n    }\n\n"}, "card_13d0efc2de37": {"id": "card_13d0efc2de37", "relpath": "contracts/synthVault.sol", "char_start": 3216, "char_end": 5170, "peek_head": "    //====================================== DEPOSIT ========================================//\n\n   ", "peek_tail": "ser as a member\n        emit MemberDeposits(_synth, _member, _amount, _weight, totalWeight);\n    }\n\n", "shingle_hash": "5492fd1bd36fd59b", "top_tokens": ["synth", "member", "weight", "deposit", "the", "amount", "record", "address", "user", "scope"], "content": "    //====================================== DEPOSIT ========================================//\n\n    // User deposits Synths in the SynthVault\n    function deposit(address synth, uint256 amount) external {\n        depositForMember(synth, msg.sender, amount);\n    }\n\n    // Contract deposits Synths in the SynthVault for user\n    function depositForMember(address synth, address member, uint256 amount) public {\n        require(iSYNTHFACTORY(_DAO().SYNTHFACTORY()).isSynth(synth), \"!synth\"); // Must be a valid synth\n        require(iBEP20(synth).transferFrom(msg.sender, address(this), amount)); // Must successfuly transfer in\n        _deposit(synth, member, amount); // Assess and record the deposit\n    }\n\n    // Check and record the deposit\n    function _deposit(address _synth, address _member, uint256 _amount) internal {\n        if(!isStakedSynth[_synth]){\n            isStakedSynth[_synth] = true; // Record as a staked synth\n            stakedSynthAssets.push(_synth); // Add to staked synth array\n        }\n        mapMemberSynth_lastTime[_member][_synth] = block.timestamp + minimumDepositTime; // Record deposit time (scope: member -> synth)\n        mapMember_depositTime[_member] = block.timestamp + minimumDepositTime; // Record deposit time (scope: member)\n        mapMemberSynth_deposit[_member][_synth] += _amount; // Record balance for member\n        uint256 _weight = iUTILS(_DAO().UTILS()).calcSpotValueInBase(iSYNTH(_synth).LayerONE(), _amount); // Get the SPARTA weight of the deposit\n        mapMemberSynth_weight[_member][_synth] += _weight; // Add the weight to the user (scope: member -> synth)\n        mapMemberTotal_weight[_member] += _weight; // Add to the user's total weight (scope: member)\n        totalWeight += _weight; // Add to the total weight (scope: vault)\n        isSynthMember[_member][_synth] = true; // Record user as a member\n        emit MemberDeposits(_synth, _member, _amount, _weight, totalWeight);\n    }\n\n"}, "card_5a1d11655ce4": {"id": "card_5a1d11655ce4", "relpath": "contracts/interfaces/iROUTER.sol", "char_start": 0, "char_end": 666, "peek_head": "// SPDX-License-Identifier: UNLICENSED\npragma solidity 0.8.3;\ninterface iROUTER {\n    function addLi", "peek_tail": "ternal view returns (uint);\n    function getPool(address) external view returns(address payable);\n}\n", "shingle_hash": "863ccf046683d721", "top_tokens": ["uint", "function", "external", "returns", "address", "payable", "view", "spdx", "license", "identifier"], "content": "// SPDX-License-Identifier: UNLICENSED\npragma solidity 0.8.3;\ninterface iROUTER {\n    function addLiquidityForMember(uint, uint, address, address) external payable returns (uint);\n    function grantFunds(uint, address) external payable returns (bool);\n    function changeArrayFeeSize(uint) external;\n    function changeMaxTrades(uint) external;\n    function addLiquidity(uint, uint, address) external payable returns (uint);\n    function totalPooled() external view returns (uint);\n    function totalVolume() external view returns (uint);\n    function totalFees() external view returns (uint);\n    function getPool(address) external view returns(address payable);\n}"}, "card_8d956d277891": {"id": "card_8d956d277891", "relpath": "contracts/synthVault.sol", "char_start": 8209, "char_end": 9305, "peek_head": "    // Calculate the user's current total claima                 linkLabel
                    .attr("x", d => (d.source.x + d.target.x) / 2)
                    .attr("y", d => (d.source.y + d.target.y) / 2);
                
                node
                    .attr("transform", d => `translate(${d.x},${d.y})`);
            });
        }
        
        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }
        
        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }
        
        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }
        
        function updateStats() {
            const stats = currentGraph.stats || {};
            let html = '';
            
            html += `<div class="stat"><span>Nodes</span><span class="stat-value">${stats.num_nodes || 0}</span></div>`;
            html += `<div class="stat"><span>Edges</span><span class="stat-value">${stats.num_edges || 0}</span></div>`;
            html += `<div class="stat"><span>Node Types</span><span class="stat-value">${(stats.node_types || []).length}</span></div>`;
            html += `<div class="stat"><span>Edge Types</span><span class="stat-value">${(stats.edge_types || []).length}</span></div>`;
            
            document.getElementById('stats').innerHTML = html;
        }
        
        function updateTypeFilter() {
            const types = new Set();
            (currentGraph.nodes || []).forEach(n => types.add(n.type));
            
            const select = document.getElementById('type-filter');
            select.innerHTML = '<option value="all">All Types</option>';
            
            Array.from(types).sort().forEach(type => {
                const option = document.createElement('option');
                option.value = type;
                option.textContent = type;
                select.appendChild(option);
            });
        }
        
        function updateLegend() {
            // Get unique node types
            const nodeTypes = new Set();
            (currentGraph.nodes || []).forEach(n => nodeTypes.add(n.type));
            
            // Get unique edge types
            const edgeTypes = new Set();
            (currentGraph.edges || []).forEach(e => edgeTypes.add(e.type));
            
            let html = '<h4>Legend</h4>';
            
            // Node types section
            if (nodeTypes.size > 0) {
                html += '<div class="legend-section">';
                html += '<div class="legend-section-title">Node Types</div>';
                Array.from(nodeTypes).sort().forEach(type => {
                    const color = typeColors[type?.toLowerCase()] || typeColors['custom'];
                    html += `<div class="legend-item">
                        <div class="legend-color" style="background: ${color};"></div>
                        <span>${type}</span>
                    </div>`;
                });
                html += '</div>';
            }
            
            // Edge types section
            if (edgeTypes.size > 0) {
                html += '<div class="legend-section">';
                html += '<div class="legend-section-title">Edge Types</div>';
                Array.from(edgeTypes).sort().forEach(type => {
                    const color = getEdgeColor(type);
                    html += `<div class="legend-item">
                        <div class="legend-line" style="background: ${color};"></div>
                        <span>${type}</span>
                    </div>`;
                });
                html += '</div>';
            }
            
            // Add observations/assumptions legend
            html += '<div class="legend-section">';
            html += '<div class="legend-section-title">Annotations</div>';
            html += '<div class="legend-item"><span style="color: #30a14e; font-weight: bold;">✓</span> <span>Verified observation</span></div>';
            html += '<div class="legend-item"><span style="color: #d29922; font-weight: bold;">?</span> <span>Unverified assumption</span></div>';
            html += '</div>';
            
            document.getElementById('legend').innerHTML = html;
        }
        
        function showNodeDetails(node) {
            const nodeColor = typeColors[node.type?.toLowerCase()] || typeColors['custom'];
            let html = `<h4 style="margin: 0 0 10px 0; color: ${nodeColor};">${node.label}</h4>`;
            html += `<div style="color: #8b949e;"><strong>Type:</strong> <span style="color: ${nodeColor};">${node.type}</span></div>`;
            html += `<div style="color: #8b949e;"><strong>ID:</strong> <span style="color: #7d8590; font-family: 'JetBrains Mono', monospace; font-size: 11px;">${node.id}</span></div>`;
            
            if (node.confidence !== undefined) {
                const confColor = node.confidence > 0.7 ? '#30a14e' : node.confidence > 0.4 ? '#d29922' : '#f9826c';
                html += `<div style="color: #8b949e;"><strong>Confidence:</strong> <span style="color: ${confColor};">${(node.confidence * 100).toFixed(0)}%</span></div>`;
            }
            
            if (node.created_by) {
                html += `<div style="color: #8b949e;"><strong>Created:</strong> <span style="color: #7d8590;">${node.created_by}</span></div>`;
            }
            
            if (node.description) {
                html += `<div style="margin-top: 10px; color: #8b949e;"><strong>Description:</strong><br/><span style="color: #e6edf3;">${node.description}</span></div>`;
            }
            
            // Observations (verified facts about the system)
            if (node.observations && node.observations.length > 0) {
                html += '<div style="margin-top: 12px; padding: 10px; background: rgba(48, 164, 78, 0.1); border-radius: 6px; border: 1px solid rgba(48, 164, 78, 0.3);">';
                html += '<strong style="color: #30a14e; font-size: 11px; text-transform: uppercase;">✓ Verified Observations</strong>';
                node.observations.forEach(obs => {
                    let obsText, obsType = 'general', obsConf = 1.0;
                    if (typeof obs === 'object') {
                        obsText = obs.description || obs.content || JSON.stringify(obs);
                        obsType = obs.type || 'general';
                        obsConf = obs.confidence !== undefined ? obs.confidence : 1.0;
                    } else {
                        obsText = String(obs);
                    }
                    const typeLabel = obsType !== 'general' ? ` [${obsType}]` : '';
                    const confLabel = obsConf < 1.0 ? ` (conf: ${obsConf.toFixed(1)})` : '';
                    html += `<div style="margin-left: 10px; margin-top: 4px; color: #30a14e; font-size: 11px; font-family: 'JetBrains Mono', monospace;">• ${obsText}${typeLabel}${confLabel}</div>`;
                });
                html += '</div>';
            }
            
            // Assumptions (unverified, needs validation)
            if (node.assumptions && node.assumptions.length > 0) {
                html += '<div style="margin-top: 12px; padding: 10px; background: rgba(210, 153, 34, 0.1); border-radius: 6px; border: 1px solid rgba(210, 153, 34, 0.3);">';
                html += '<strong style="color: #d29922; font-size: 11px; text-transform: uppercase;">? Unverified Assumptions</strong>';
                node.assumptions.forEach(assum => {
                    let assumText, assumType = 'general', assumConf = 0.5;
                    if (typeof assum === 'object') {
                        assumText = assum.description || assum.content || JSON.stringify(assum);
                        assumType = assum.type || 'general';
                        assumConf = assum.confidence !== undefined ? assum.confidence : 0.5;
                    } else {
                        assumText = String(assum);
                    }
                    const typeLabel = assumType !== 'general' ? ` [${assumType}]` : '';
                    html += `<div style="margin-left: 10px; margin-top: 4px; color: #d29922; font-size: 11px; font-family: 'JetBrains Mono', monospace;">• ${assumText}${typeLabel} (conf: ${assumConf.toFixed(1)})</div>`;
                });
                html += '</div>';
            }
            
            if (node.properties && Object.keys(node.properties).length > 0) {
                html += '<div style="margin-top: 12px;"><strong style="color: #58a6ff; font-size: 11px; text-transform: uppercase;">Properties</strong></div>';
                for (const [key, value] of Object.entries(node.properties)) {
                    html += `<div style="margin-left: 10px; color: #8b949e; font-size: 12px;">• ${key}: <span style="color: #7d8590;">${JSON.stringify(value)}</span></div>`;
                }
            }
            
            if (node.source_refs && node.source_refs.length > 0) {
                html += '<div style="margin-top: 12px;"><strong style="color: #56d364; font-size: 11px; text-transform: uppercase;">Source References</strong></div>';
                node.source_refs.forEach(ref => {
                    html += `<div style="margin-left: 10px; font-size: 10px; color: #7d8590; font-family: 'JetBrains Mono', monospace;">• ${ref}</div>`;
                });
            }
            
            document.getElementById('node-info').innerHTML = html;
            
            // Update card viewer
            updateCardViewer(node);
        }
        
        function updateCardViewer(node) {
            const cardViewer = document.getElementById('card-viewer');
            const noCards = document.getElementById('no-cards');
            const cardSelector = document.getElementById('card-selector');
            
            if (node.source_refs && node.source_refs.length > 0) {
                // Show card viewer
                cardViewer.style.display = 'block';
                noCards.style.display = 'none';
                
                // Clear and populate selector
                cardSelector.innerHTML = '<option value="">Select a card to view code</option>';
                
                node.source_refs.forEach(cardId => {
                    if (cardStore[cardId]) {
                        const card = cardStore[cardId];
                        const option = document.createElement('option');
                        option.value = cardId;
                        option.textContent = `${cardId} (${card.relpath || 'unknown file'})`;
                        cardSelector.appendChild(option);
                    }
                });
                
                // Handle card selection
                cardSelector.onchange = function() {
                    const cardId = this.value;
                    const cardContent = document.getElementById('card-content');
                    
                    if (cardId && cardStore[cardId]) {
                        const card = cardStore[cardId];
                        let content = '';
                        
                        // Show file path
                        if (card.relpath) {
                            content += `// File: ${card.relpath}\n`;
                            if (card.char_start !== undefined && card.char_end !== undefined) {
                                content += `// Characters: ${card.char_start}-${card.char_end}\n`;
                            }
                            content += '\n';
                        }
                        
                        // Show actual code content
                        if (card.content) {
                            content += card.content;
                        } else if (card.peek_head || card.peek_tail) {
                            content += card.peek_head || '';
                            if (card.peek_head && card.peek_tail) {
                                content += '\n...\n';
                            }
                            content += card.peek_tail || '';
                        } else {
                            content = 'No content available for this card';
                        }
                        
                        cardContent.textContent = content;
                    } else {
                        cardContent.innerHTML = '<em style="color: #888;">Select a card above to view its content</em>';
                    }
                };
            } else {
                // Hide card viewer
                cardViewer.style.display = 'none';
                noCards.style.display = 'block';
            }
        }
        
        function updateObservations() {
            let html = '';
            const recentObs = observations.slice(-10).reverse();
            
            recentObs.forEach(obs => {
                html += `<div class="observation">${obs}</div>`;
            });
            
            if (html === '') {
                html = '<em style="color: #888;">No observations yet</em>';
            }
            
            document.getElementById('observations').innerHTML = html;
        }
        
        function setupEventListeners() {
            document.getElementById('graph-selector').addEventListener('change', (e) => {
                loadGraph(e.target.value);
            });
            
            document.getElementById('type-filter').addEventListener('change', (e) => {
                filterNodesByType(e.target.value);
            });
            
            document.getElementById('layout-selector').addEventListener('change', (e) => {
                changeLayout(e.target.value);
            });
            
            document.getElementById('reset-view').addEventListener('click', () => {
                resetView();
            });
        }
        
        function filterNodesByType(type) {
            d3.selectAll('.node').style('opacity', d => {
                return type === 'all' || d.type === type ? 1 : 0.1;
            });
        }
        
        function changeLayout(layout) {
            // Simplified - would implement different layout algorithms
            if (simulation) {
                simulation.alpha(1).restart();
            }
        }
        
        function resetView() {
            const svg = d3.select("svg");
            const width = svg.attr("width");
            const height = svg.attr("height");
            
            svg.transition()
                .duration(750)
                .call(
                    d3.zoom().transform,
                    d3.zoomIdentity.translate(width / 2, height / 2).scale(1)
                );
        }
        
        // Initialize on load
        init();
    </script>
</body>
</html>
